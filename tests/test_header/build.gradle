plugins {
    id 'com.android.application'
}

android {
    namespace = "com.renegade.test_header"
    compileSdk = 36

    defaultConfig {
        applicationId = "com.renegade.test_header"
        minSdk = 28
        targetSdk = 34
        versionCode = 1
        versionName = "1.0"
        
        externalNativeBuild {
            cmake {
                cppFlags += "-std=c++17"
                abiFilters += ["arm64-v8a", "x86_64"]
                arguments += ['-DANDROID_STL=c++_static']
            }
        }        
    }

    buildTypes {
        release {
            minifyEnabled = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }
    externalNativeBuild {
        cmake {
            version = "3.22.1"
            path = "CMakeLists.txt"
        }
    }
    sourceSets {
        main {
            assets.srcDirs = ['./assets']
        }
    }
}

dependencies {
}
